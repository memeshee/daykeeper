<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daykeeper — one day of authority</title>
  <style>
    /* Product typefaces, inlined as base64 so the file is self-contained. */
    __FONTS__

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper:        #f2eee4;
      --paper-raised: #faf7ef;
      --ink:          #191512;
      --ink-soft:     #4a423b;
      --ink-faint:    #857a6d;
      --rule:         #d6cdba;
      --signal:       #be3a26;
      --sage:         #566b4d;
      --gold:         #a98039;
      --font-mono:    'IBM Plex Mono', ui-monospace, 'DejaVu Sans Mono', monospace;
      --font-serif:   'Instrument Serif', Georgia, serif;
    }

    body {
      font-family: var(--font-mono);
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Lifecycle · one round of the treasury</p>
    <h1>Authority arrives as a key, and the key stops existing</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img"
           aria-labelledby="daykeeper-day-title daykeeper-day-desc">
        <title id="daykeeper-day-title">One day of authority in the Daykeeper treasury</title>
        <desc id="daykeeper-day-desc">State diagram of one round: bidding opens and raises the floor, the round clock ends and the bell is due, a settle installs two scoped keys on the seated keeper, the deadline deletes them and returns the treasury to bidding. A no-bid settle installs no keys at all.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#857a6d"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#be3a26"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f2eee4"/>

        <!-- ─── arrows first, so strokes sit behind the state boxes ─── -->

        <!-- the round's clock runs out -->
        <line x1="188" y1="168" x2="284" y2="168" stroke="#857a6d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- settle installs the two keys -->
        <line x1="432" y1="168" x2="528" y2="168" stroke="#857a6d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- the deadline deletes them -->
        <line x1="676" y1="168" x2="772" y2="168" stroke="#857a6d" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- bid() raises the floor: self-loop under the first phase -->
        <path d="M 74 216 V 256 Q 74 264 82 264 H 146 Q 154 264 154 256 V 216"
              fill="none" stroke="#857a6d" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- grant() pays from the pool: self-loop under the seated phase, accent -->
        <path d="M 562 216 V 256 Q 562 264 570 264 H 634 Q 642 264 642 256 V 216"
              fill="none" stroke="#be3a26" stroke-width="1.3" marker-end="url(#arrow-accent)"/>

        <!-- settle() with no bid: the recovery path, no keys installed -->
        <line x1="358" y1="216" x2="358" y2="280" stroke="#857a6d" stroke-width="1.2"
              stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 432 322 H 882 Q 890 322 890 314 V 216"
              fill="none" stroke="#857a6d" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- the next round opens -->
        <path d="M 846 120 V 80 Q 846 72 838 72 H 122 Q 114 72 114 80 V 120"
              fill="none" stroke="#857a6d" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ─── transition labels, each on its own opaque mask ─── -->

        <rect x="198" y="146" width="76" height="12" rx="2" fill="#f2eee4"/>
        <text x="236" y="155" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">ROUND_END_NS</text>

        <rect x="440" y="146" width="80" height="12" rx="2" fill="#f2eee4"/>
        <text x="480" y="155" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">SETTLE [BID&gt;0]</text>

        <rect x="690" y="146" width="68" height="12" rx="2" fill="#f2eee4"/>
        <text x="724" y="155" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">ROUND_END_NS</text>

        <rect x="366" y="236" width="80" height="12" rx="2" fill="#f2eee4"/>
        <text x="406" y="245" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">SETTLE [NO BID]</text>

        <rect x="628" y="300" width="64" height="12" rx="2" fill="#f2eee4"/>
        <text x="660" y="309" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">STAYS VACANT</text>

        <rect x="450" y="50" width="60" height="12" rx="2" fill="#f2eee4"/>
        <text x="480" y="59" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">NEXT ROUND</text>

        <rect x="97" y="246" width="34" height="12" rx="2" fill="#f2eee4"/>
        <text x="114" y="255" fill="#4a423b" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">bid()</text>

        <rect x="579" y="246" width="46" height="12" rx="2" fill="#f2eee4"/>
        <text x="602" y="255" fill="#be3a26" font-size="8" font-weight="400" letter-spacing="0.06em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">grant()</text>

        <!-- ─── the primary phase rail ─── -->

        <rect x="40" y="120" width="148" height="96" rx="8" fill="#faf7ef" stroke="#4a423b" stroke-width="1"/>
        <text x="114" y="172" fill="#191512" font-size="12" font-weight="600"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">BIDDING OPEN</text>
        <text x="114" y="192" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">bid() raises the floor</text>

        <rect x="284" y="120" width="148" height="96" rx="8" fill="#faf7ef" stroke="#4a423b" stroke-width="1"/>
        <text x="358" y="172" fill="#191512" font-size="12" font-weight="600"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">AWAITING THE BELL</text>
        <text x="358" y="192" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">anyone may ring it</text>

        <rect x="528" y="120" width="148" height="96" rx="8" fill="#faf7ef" stroke="#be3a26" stroke-width="1.4"/>
        <text x="602" y="164" fill="#191512" font-size="12" font-weight="600"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">KEEPER SEATED</text>
        <text x="602" y="184" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">grant: one, never self</text>
        <text x="602" y="199" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">voice: say() only</text>

        <rect x="772" y="120" width="148" height="96" rx="8" fill="#faf7ef" stroke="#4a423b" stroke-width="1"/>
        <text x="846" y="172" fill="#191512" font-size="12" font-weight="600"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">DAY OVER</text>
        <text x="846" y="192" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">keys revoked at settle</text>

        <!-- the recovery state, recessed -->
        <rect x="284" y="288" width="148" height="68" rx="8" fill="#f2eee4" stroke="#857a6d" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="358" y="318" fill="#4a423b" font-size="12" font-weight="600"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">VACANT</text>
        <text x="358" y="336" fill="#857a6d" font-size="9" font-weight="400"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">settle(), no bid</text>

        <!-- ─── what the seated keeper actually holds ─── -->

        <rect x="40" y="390" width="880" height="102" rx="6" fill="#faf7ef" stroke="#d6cdba" stroke-width="1"/>
        <text x="56" y="410" fill="#857a6d" font-size="8" font-weight="400" letter-spacing="0.14em"
              font-family="'IBM Plex Mono', monospace">THE TWO KEYS · WHILE THE DAY LASTS</text>

        <rect x="56" y="424" width="52" height="16" rx="2" fill="none" stroke="#4a423b" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="82" y="435" fill="#4a423b" font-size="7" font-weight="400" letter-spacing="0.08em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">GRANT</text>
        <text x="120" y="436" fill="#191512" font-size="10" font-weight="400"
              font-family="'IBM Plex Mono', monospace">one transfer a day · at most give_yocto · never to the keeper</text>

        <rect x="56" y="456" width="52" height="16" rx="2" fill="none" stroke="#4a423b" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="82" y="467" fill="#4a423b" font-size="7" font-weight="400" letter-spacing="0.08em"
              font-family="'IBM Plex Mono', monospace" text-anchor="middle">VOICE</text>
        <text x="120" y="468" fill="#191512" font-size="10" font-weight="400"
              font-family="'IBM Plex Mono', monospace">say() — speak as the treasury · moves no money</text>

        <!-- ─── legend: horizontal strip, never inside the diagram area ─── -->

        <line x1="40" y1="530" x2="920" y2="530" stroke="#d6cdba" stroke-width="0.8"/>
        <text x="40" y="557" fill="#857a6d" font-size="8" font-weight="400" letter-spacing="0.14em"
              font-family="'IBM Plex Mono', monospace">LEGEND</text>

        <rect x="120" y="548" width="26" height="10" rx="8" fill="#faf7ef" stroke="#4a423b" stroke-width="1"/>
        <text x="154" y="557" fill="#4a423b" font-size="8" font-family="'IBM Plex Mono', monospace">A PHASE</text>

        <rect x="250" y="548" width="26" height="10" rx="8" fill="#faf7ef" stroke="#be3a26" stroke-width="1.4"/>
        <text x="284" y="557" fill="#4a423b" font-size="8" font-family="'IBM Plex Mono', monospace">THE SEATED KEEPER</text>

        <line x1="440" y1="553" x2="466" y2="553" stroke="#857a6d" stroke-width="1.2" stroke-dasharray="5,4"/>
        <text x="476" y="557" fill="#4a423b" font-size="8" font-family="'IBM Plex Mono', monospace">NO KEEPER, NO KEYS</text>
      </svg>
    </div>
  </div>
</body>
</html>
